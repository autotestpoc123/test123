<span class="user-avatar" [ngClass]="[size, shape, variant]" [class.clickable]="isInteractive"
  [attr.role]="isInteractive ? 'button' : null" [attr.tabindex]="isInteractive ? 0 : null"
  [attr.aria-label]="isInteractive ? ('View photo of ' + (fullName || msid || '')) : null"
  (click)="onClick($event)" (keydown)="onKeydown($event)">
  @if (loaded && photoUrl) {
    <img [src]="photoUrl" [alt]="fullName || msid || ''"
      (load)="onImageLoad($event)" (error)="onImageError()" />
  } @else if (loaded) {
    <span class="avatar-default" aria-hidden="true">
      <i class="fa fa-user"></i>
    </span>
  } @else {
    <span class="avatar-placeholder" aria-hidden="true"></span>
  }
</span>
